services:
  - type: web
    name: call-intelligence
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # set this manually in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
